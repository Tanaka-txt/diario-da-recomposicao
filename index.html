<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e13">
<meta name="description" content="Diário de treino e alimentação para um ciclo de 12 semanas de recomposição corporal.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0e13'/%3E%3Cpath d='M12 26v12M19 21v22M45 21v22M52 26v12M19 32h26' stroke='%236d8bff' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<title>Diário da Recomposição</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: uma coluna de cartões escuros, como o painel de um aparelho; números grandes em fonte de placar; barra de abas fixa embaixo */
:root{
  --bg:#0a0e13; --surface:#121820; --surface-2:#1a222d; --ink:#eef2f7; --ink-2:#aab5c3; --ink-3:#717d8d; --line:#232d3a;
  --accent:#6d8bff; --accent-ink:#0a0f24; --accent-soft:#18214a;
  --water:#42c2ff; --water-soft:#0f2a3a; --prot:#ffa24c; --prot-soft:#33230f; --carb:#b48cff; --carb-soft:#251b3d;
  --good:#33d69f; --good-soft:#0d2b22; --warn:#ffc24a; --warn-soft:#33280c; --bad:#ff5d6c; --bad-soft:#3a1419;
  --body:#2a3542; --mus-off:#1f2934; --mus-pri:#ff4d5e; --mus-sec:#ff9a6b; --heat1:#4a2630; --heat2:#9a303d; --heat3:#ff4d5e;
  --scrim:rgba(0,0,0,.66);
  --font-d:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-b:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;overflow-x:hidden;overflow-x:clip;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(160px + env(safe-area-inset-bottom,0px))}
.view{display:grid;gap:14px}
.vhead{display:grid;gap:4px;padding-block:2px 4px}
.kicker{font:600 14px/1.2 var(--font-d);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
h1{font:700 34px/1.02 var(--font-d);margin:0;text-wrap:balance}
h2{font:700 24px/1.1 var(--font-d);margin:0;text-wrap:balance}
h3{font:600 17px/1.25 var(--font-b);margin:0}
p{margin:0}
.sub{color:var(--ink-2);font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.eyebrow{font:600 14px/1.1 var(--font-d);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.meta{font-size:14px;color:var(--ink-3)}
.big{font:700 46px/1 var(--font-d);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.big.w{color:var(--water)} .big.p{color:var(--prot)}
.numrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hint{font-size:14px;color:var(--ink-3)}
.crow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.segs{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px}
.seg{height:26px;border-radius:4px;background:var(--water-soft)}
.seg.on{background:var(--water)}
.seg:nth-child(2n){margin-right:3px}
.bar{height:10px;border-radius:999px;background:var(--prot-soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--prot);border-radius:inherit}
.btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.btns2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.btn{min-height:48px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:15px;line-height:1.15;text-align:center}
.btn small{display:block;font-weight:500;font-size:12.5px;margin-top:2px;opacity:.8}
.btn.w{background:var(--water-soft);border-color:transparent;color:var(--water)}
.btn.p{background:var(--prot-soft);border-color:transparent;color:var(--prot)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.wide{width:100%;min-height:54px;font-size:17px}
.btn[disabled]{opacity:.5;cursor:default}
.btn:not([disabled]):active,.opt:active,.done:active{transform:translateY(1px)}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 0;white-space:nowrap}
.checks{display:grid}
.chk{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 0}
.chk:first-child{border-top:0;padding-top:2px}
.box{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center}
.box svg{width:16px;height:16px;opacity:0}
.chk.on .box{background:var(--good);border-color:var(--good);color:var(--surface)}
.chk.on .box svg{opacity:1}
.chk b{display:block;font-weight:600}
.chk span.h{display:block;font-size:14px;color:var(--ink-3)}
.inline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.inp{width:100%;min-width:0;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 21px var(--font-d);text-align:center;font-variant-numeric:tabular-nums;padding:0 6px}
.inp::placeholder{color:var(--ink-3);font-weight:500;font-size:17px}
.unit{font:600 18px var(--font-d);color:var(--ink-2)}
.banner{background:var(--warn-soft);color:var(--warn);padding:12px 14px;border-radius:12px;font-size:14px;font-weight:500}
/* treino */
.fichas{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.fch{min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:700 26px/1 var(--font-d);display:grid;place-items:center;align-content:center;gap:2px}
.fch small{font:600 10.5px/1 var(--font-b);letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.fch[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fch[aria-pressed="true"] small{color:inherit;opacity:.75}
.ex header{display:grid;gap:3px}
.tag{font-size:13.5px;color:var(--ink-3)}
.alvo{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.alvo b{font:700 24px/1 var(--font-d);font-variant-numeric:tabular-nums}
.last{font-size:14px;color:var(--ink-2)}
.sets{display:grid;gap:6px}
.srow{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 48px;gap:8px;align-items:center}
.srow.one{grid-template-columns:22px minmax(0,1fr) 48px}
.srow.h{font:600 12px/1 var(--font-d);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.srow.h span{text-align:center}
.sn{font:700 18px var(--font-d);color:var(--ink-3);text-align:center}
.done{width:48px;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;color:var(--ink-3)}
.done svg{width:22px;height:22px}
.done.on{background:var(--good);border-color:var(--good);color:var(--surface)}
.exnota{font-size:14px;color:var(--ink-2);padding:9px 11px;background:var(--surface-2);border-radius:8px}
.pill{display:inline-block;font:700 12.5px/1 var(--font-d);letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:999px;white-space:nowrap}
.pill.sobe{background:var(--good-soft);color:var(--good)}
.pill.mantem{background:var(--surface-2);color:var(--ink-2)}
.pill.baixa{background:var(--warn-soft);color:var(--warn)}
.res{display:grid}
.resrow{display:grid;gap:5px;padding-block:12px;border-top:1px solid var(--line)}
.resrow:first-child{border-top:0}
.resrow .rh{display:flex;justify-content:space-between;gap:10px;align-items:center}
.resrow p{font-size:15px;color:var(--ink-2)}
.resrow p.n{font-size:14px;color:var(--warn)}
/* cardio */
.status{display:grid;gap:8px}
.wdots{display:flex;gap:6px;align-items:center}
.wd{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent)}
.wd.on{background:var(--accent)}
.linhas{display:grid;gap:6px}
.lin{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:14px;align-items:baseline}
.lin b{font:700 16px var(--font-d);letter-spacing:.03em}
.lin.cur{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.lin.feito{opacity:.55}
.hist{display:grid}
.hrow{display:flex;justify-content:space-between;gap:10px;padding-block:9px;border-top:1px solid var(--line);font-size:14.5px}
.hrow:first-child{border-top:0}
.hrow span:last-child{color:var(--ink-3);text-align:right}
.rules{display:grid;gap:8px;padding-left:20px;margin:0;font-size:15px;color:var(--ink-2)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;font-weight:500;font-size:15px}
/* progresso */
.cbar{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px}
.cs{height:14px;border-radius:3px;background:var(--surface-2)}
.cs.past{background:var(--accent);opacity:.55}
.cs.now{background:var(--accent)}
.cfases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;font-size:12.5px;color:var(--ink-3)}
.cfases span{border-top:2px solid var(--line);padding-top:4px}
.chart{width:100%;height:auto;display:block}
.ch-grid{stroke:var(--line);stroke-width:1;fill:none}
.ch-area{fill:var(--accent-soft)}
.ch-line{stroke:var(--accent);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.ch-dot{fill:var(--accent)}
.ch-lbl{fill:var(--ink-3);font:500 11px var(--font-b)}
.g7{display:grid;grid-template-columns:70px repeat(7,minmax(0,1fr));gap:8px 3px;align-items:center;font-size:13.5px}
.g7 .dh{text-align:center;font:600 13px/1.15 var(--font-d);color:var(--ink-3);text-transform:uppercase}
.g7 .dh.today{color:var(--accent)}
.g7 .rl{color:var(--ink-2);font-weight:600}
.dot{width:24px;height:24px;border-radius:50%;margin:0 auto;border:2px solid var(--line);display:grid;place-items:center;font:700 12px/1 var(--font-d)}
.dot.half{border-color:var(--good);background:var(--good-soft)}
.dot.full{background:var(--good);border-color:var(--good);color:var(--surface)}
.list{display:grid;gap:6px;padding-left:20px;margin:0;color:var(--ink-2);font-size:15px}
/* proteína */
.fechar{background:var(--prot-soft);color:var(--ink);padding:10px 12px;border-radius:10px;font-size:15px;font-weight:500}
.itens{display:grid}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto 36px;gap:10px;align-items:center;padding-block:6px;border-top:1px solid var(--line);font-size:15px}
.item:first-child{border-top:0}
.item span:nth-child(2){color:var(--prot);font-weight:600;font-variant-numeric:tabular-nums}
.x{width:36px;height:36px;border-radius:8px;border:0;background:var(--surface-2);font-size:20px;line-height:1;color:var(--ink-2)}
.foods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.food{display:grid;gap:2px;align-content:center;text-align:left;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);min-height:54px}
.food b{font-weight:600;font-size:15px;line-height:1.2}
.food span{font-size:12.5px;color:var(--ink-3)}
.food[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.food[aria-pressed="true"] span{color:inherit;opacity:.75}
.qtys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sug{background:var(--prot-soft);color:var(--ink);padding:12px 14px;border-radius:10px;font-size:15px}
.opc summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:15px;padding-block:4px}
.opc[open]{display:grid;gap:10px}
/* revisão, carbo, sono, semana, fotos */
.recado{background:var(--accent-soft);border-color:var(--accent)}
.recado .eyebrow{color:var(--accent)}
.segc{position:relative;display:block;height:26px;border-radius:4px;background:var(--carb-soft);overflow:hidden}
.segc b{position:absolute;left:0;top:0;bottom:0;background:var(--carb)}
.segc.over{background:var(--warn-soft)}
.segc.over b{background:var(--warn)}
.big.c{color:var(--carb)}
.btn.c{background:var(--carb-soft);border-color:transparent;color:var(--carb)}
.exs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.exb{display:grid;gap:2px;align-content:center;text-align:left;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);min-height:54px}
.exb:last-child{grid-column:1/-1}
.exb b{font-weight:600;font-size:15px;line-height:1.2}
.exb span{font-size:12.5px;color:var(--ink-3)}
.chips5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.chips5 .opt{padding:0 4px;font-variant-numeric:tabular-nums}
.escala{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-3)}
.kvs{display:grid}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;padding-block:8px;border-top:1px solid var(--line);align-items:baseline}
.kv:first-child{border-top:0;padding-top:0}
.kv span{color:var(--ink-2);font-size:15px}
.kv b{font-weight:600;font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.kv small{grid-column:2;text-align:right;font-size:12.5px;color:var(--ink-3)}
.poses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pose{display:grid;gap:6px;align-content:start}
.pose img,.ph,.fig img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--surface-2);display:block}
.ph{display:grid;place-items:center;color:var(--ink-3);font-size:13px;border:1px dashed var(--line)}
.pose .btn{min-height:44px;padding:6px}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cmp.um{grid-template-columns:minmax(0,1fr);max-width:62%}
.fig{margin:0;display:grid;gap:4px}
.fig figcaption{font-size:13px;color:var(--ink-3)}
.cropcv{width:100%;height:auto;border-radius:10px;display:block;background:var(--surface-2)}
input[type=range]{width:100%;height:32px;accent-color:var(--accent)}
/* ordem e sessão */
.ord{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--bg);font:700 17px/1 var(--font-d);margin-right:8px;vertical-align:-3px}
.ex h3{display:flex;align-items:flex-start;gap:0}
.ordem{display:grid;margin:0;padding:0;list-style:none}
.ordem li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding-block:8px;border-top:1px solid var(--line);font-size:15px}
.ordem li:first-child{border-top:0;padding-top:0}
.ordem .on{font:700 17px/1 var(--font-d);color:var(--ink-3);text-align:center}
.ordem .ob{font:600 17px/1.1 var(--font-d);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.obj{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.obj .eyebrow{color:var(--accent)}
.obj b{font:700 22px/1 var(--font-d);font-variant-numeric:tabular-nums}
.sess{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sess b{font:700 28px/1 var(--font-d);font-variant-numeric:tabular-nums}
/* registro */
.sel{width:100%;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 16px var(--font-b);padding:0 12px}
.evo{display:grid}
.evo .hrow b{font-weight:600}
.day{border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day summary{list-style:none;cursor:pointer;display:grid;gap:2px;padding-block:11px}
.day summary::-webkit-details-marker{display:none}
.day summary b{font:700 18px/1.1 var(--font-d)}
.day summary span{font-size:14px;color:var(--ink-3)}
.day[open] summary b{color:var(--accent)}
.dex{display:grid;gap:4px;padding-bottom:12px;font-size:14.5px;color:var(--ink-2)}
.dex div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.dex div span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
/* barra de descanso */
.restbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:21;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.restin{position:relative;overflow:hidden;max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 12px 14px;display:flex;align-items:center;gap:8px}
.rest-txt{flex:1;min-width:0;display:grid}
.rest-txt span{font-size:13px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest-txt b{font:700 30px/1 var(--font-d);font-variant-numeric:tabular-nums}
.rbtn{background:transparent;border:1px solid currentColor;border-radius:10px;min-height:44px;padding:0 12px;font-weight:600;font-size:14px}
.rest-prog{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);width:0}
.restbar.pronto .restin{background:var(--good);color:var(--surface)}
.restbar.pronto .rest-prog{background:var(--surface)}
/* abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
.tab{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:6px 0;border-radius:10px;color:var(--ink-3);font:600 12px var(--font-b)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
/* folha */
.sheet{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end}
.sheet-in{width:100%;max-width:600px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;max-height:88%;overflow:auto;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px}
.fld{display:grid;gap:8px}
.seg2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg3 .opt{padding:6px 8px;line-height:1.2}
.opt{min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:600}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* cronômetro da esteira */
.run{position:fixed;inset:0;z-index:40;background:var(--surface);color:var(--ink);display:grid;grid-template-rows:auto 1fr auto;gap:12px;padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.run.tiro{background:var(--accent);color:var(--accent-ink)}
.run-top{display:flex;justify-content:space-between;gap:10px;font:600 16px var(--font-d);letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.run-mid{display:grid;align-content:center;justify-items:center;text-align:center;gap:4px}
.run-phase{font:700 24px/1.1 var(--font-d);letter-spacing:.08em;text-transform:uppercase}
.run-speed{font:700 clamp(110px,34vw,200px)/.88 var(--font-d);font-variant-numeric:tabular-nums}
.run-unit{font:600 24px var(--font-d);letter-spacing:.06em;opacity:.8}
.run-time{font:700 64px/1 var(--font-d);font-variant-numeric:tabular-nums;margin-top:14px}
.run-next{font-size:16px;opacity:.85;margin-top:6px}
.run-bot{display:grid;gap:14px}
.run-prog{height:8px;border-radius:999px;border:1px solid currentColor;overflow:hidden}
.run-prog i{display:block;height:100%;background:currentColor;width:0}
.run .btn{background:transparent;border:2px solid currentColor;color:inherit}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14.5px;font-weight:500;width:max-content;max-width:calc(100% - 32px)}
/* redesenho: superfícies, toque e movimento */
.card{border-radius:var(--r)}
.btn{transition:transform .12s ease,background .2s}
.btn:not([disabled]):active,.opt:active,.chip:active,.exb:active,.val:active{transform:scale(.97)}
.fch[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fch[aria-pressed="true"] small{color:inherit;opacity:.8}
.tab{transition:color .2s,background .2s}
.view.enter>*{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
.view.enter>*:nth-child(2){animation-delay:.03s}.view.enter>*:nth-child(3){animation-delay:.06s}.view.enter>*:nth-child(4){animation-delay:.09s}.view.enter>*:nth-child(n+5){animation-delay:.12s}
@keyframes rise{from{opacity:.2;transform:translateY(10px)}to{opacity:1;transform:none}}
/* anéis */
.rings{display:grid;grid-template-columns:136px minmax(0,1fr);gap:16px;align-items:center}
.rings svg{width:136px;height:136px;display:block}
.rt{fill:none;stroke:var(--surface-2)}
.rp{fill:none;stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.rleg{display:grid;gap:12px;min-width:0}
.rl{display:grid;grid-template-columns:10px minmax(0,1fr);gap:4px 10px;align-items:baseline}
.rl i{width:10px;height:10px;border-radius:3px;align-self:center}
.rl b{font:700 24px/1 var(--font-d);font-variant-numeric:tabular-nums}
.rl span{grid-column:2;font-size:13px;color:var(--ink-3)}
.rl.ok b{color:var(--good)}
.rl.ok span{color:var(--good)}
.rl.over b,.rl.over span{color:var(--warn)}
/* séries com deslizar */
.sets2{display:grid;gap:8px}
.shead{display:grid;grid-template-columns:24px minmax(0,1fr) 14px minmax(0,1fr) 48px;gap:8px;padding:0 6px;font:600 12px/1 var(--font-d);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:center}
.shead.one{grid-template-columns:24px minmax(0,1fr) 48px}
.srow2{position:relative;border-radius:14px;overflow:hidden;background:var(--good-soft)}
.srow2.feita{background:var(--bad-soft)}
.sbg{position:absolute;inset:0;display:flex;align-items:center;gap:8px;padding-left:18px;color:var(--good);font:700 15px var(--font-d);letter-spacing:.08em;text-transform:uppercase;opacity:0}
.srow2.feita .sbg{color:var(--bad)}
.sfg{position:relative;display:grid;grid-template-columns:24px minmax(0,1fr) 14px minmax(0,1fr) 48px;gap:8px;align-items:center;padding:6px;background:var(--surface-2);border-radius:14px;touch-action:pan-y;transition:transform .22s cubic-bezier(.2,.8,.2,1),background .25s}
.sfg.one{grid-template-columns:24px minmax(0,1fr) 48px}
.sfg.drag{transition:none}
.val{min-width:0;height:50px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);display:flex;align-items:baseline;justify-content:center;gap:4px;font:700 26px/50px var(--font-d);font-variant-numeric:tabular-nums;padding:0 4px}
.val small{font:600 12px var(--font-b);color:var(--ink-3)}
.val.tg{color:var(--ink-3)}
.xx{color:var(--ink-3);text-align:center;font-weight:600}
.srow2.feita .sfg{background:var(--good-soft)}
.srow2.feita .val{border-color:transparent;background:transparent;color:var(--good)}
.srow2.feita .sn{color:var(--good)}
.prp{display:inline-block;font:700 11px/1 var(--font-d);letter-spacing:.08em;padding:4px 6px;border-radius:6px;background:var(--warn);color:#1a1300;vertical-align:2px}
.swhint{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3)}
.swhint i{display:inline-block;width:26px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--good),transparent)}
.best{font-size:13px;color:var(--warn)}
/* seletor de deslizar */
.pk-read{display:flex;align-items:baseline;justify-content:center;gap:8px;font:700 60px/1 var(--font-d);font-variant-numeric:tabular-nums}
.pk-read small{font:600 15px var(--font-b);color:var(--ink-3)}
.pk-read span{color:var(--ink-3);font-size:30px}
.pk-lbl{display:flex;justify-content:space-between;align-items:center;font:600 13px/1 var(--font-d);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.sheet-in>*{min-width:0}
.ruler{position:relative;min-width:0;max-width:100%;overflow:hidden;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.rl-sc{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-inline:calc(50% - 28px);scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.rl-sc::-webkit-scrollbar{display:none}
.rl-i{flex:0 0 56px;scroll-snap-align:center;height:70px;display:grid;justify-items:center;align-content:center;gap:6px;color:var(--ink-3);font:600 18px var(--font-d);user-select:none;-webkit-user-select:none;background:none;border:0;padding:0}
.rl-i::before{content:"";width:2px;height:14px;background:var(--line);border-radius:2px}
.rl-i.on{color:var(--ink);transform:scale(1.4)}
.rl-i.on::before{background:var(--accent);height:20px}
.rl-mark{position:absolute;left:50%;top:6px;bottom:6px;width:58px;transform:translateX(-50%);border-radius:12px;border:2px solid var(--accent);pointer-events:none}
.pk-steps{display:flex;gap:6px}
.pk-steps button{min-width:44px;min-height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font:600 14px var(--font-b)}
/* mapa do corpo */
.corpo{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
.corpo .b{fill:var(--body)}
.corpo .m{fill:var(--mus-off);transition:fill .3s}
.corpo .m.s{fill:var(--mus-sec)}
.corpo .m.p{fill:var(--mus-pri)}
.corpo .m.h1{fill:var(--heat1)}.corpo .m.h2{fill:var(--heat2)}.corpo .m.h3{fill:var(--heat3)}
.corpo text{fill:var(--ink-3);font:600 11px var(--font-b)}
.exh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
.exh-t{display:grid;gap:3px;min-width:0}
.mini{width:54px;height:76px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:3px;display:grid;place-items:center;overflow:hidden}
.mini svg{width:100%;height:100%;display:block}
.mini img{width:100%;height:100%;object-fit:cover;border-radius:9px;display:block}
.mini[aria-expanded="true"]{border-color:var(--accent)}
.exinfo{display:grid;gap:10px;padding:12px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.exmedia{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:center}
.exmedia.so{grid-template-columns:minmax(0,1fr)}
.exmedia img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;display:block}
.mleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2)}
.mleg span{display:flex;align-items:center;gap:6px}
.mleg i{width:10px;height:10px;border-radius:3px;flex:none}
/* semáforo */
.sem-top{display:flex;gap:16px;align-items:center}
.sem-luz{display:grid;gap:7px;padding:9px;border-radius:16px;background:var(--bg);border:1px solid var(--line)}
.sem-luz i{width:18px;height:18px;border-radius:50%;background:var(--surface-2)}
.sem-luz i.r.on{background:var(--bad)}.sem-luz i.y.on{background:var(--warn)}.sem-luz i.g.on{background:var(--good)}
.sem-n{font:700 46px/1 var(--font-d);font-variant-numeric:tabular-nums}
.sem-n small{font-size:22px;color:var(--ink-3)}
.sem-list{display:grid}
.semr{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:3px 10px;padding-block:11px;border-top:1px solid var(--line);align-items:baseline}
.semr:first-child{border-top:0;padding-top:2px}
.semr i{width:12px;height:12px;border-radius:50%;align-self:center}
.semr i.g{background:var(--good)}.semr i.y{background:var(--warn)}.semr i.r{background:var(--bad)}.semr i.n{background:transparent;border:2px solid var(--line)}
.semr b{font-weight:600}
.semr .v{font:600 17px var(--font-d);font-variant-numeric:tabular-nums;color:var(--ink-2);text-align:right}
.semr p{grid-column:2/-1;font-size:14px;color:var(--ink-3)}
.prio{background:var(--accent-soft);border:1px solid var(--accent);padding:12px 14px;border-radius:12px;font-size:15px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills span{font-size:13px;padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
/* comemoração */
.cele{position:fixed;inset:0;z-index:70;pointer-events:none;display:grid;place-items:center;padding:20px}
.cele canvas{position:absolute;inset:0;width:100%;height:100%}
.cele .cc{position:relative;background:var(--surface-2);border:1px solid var(--warn);border-radius:20px;padding:20px 24px;text-align:center;display:grid;gap:6px;max-width:320px;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.cele .cc b{font:700 32px/1.05 var(--font-d);color:var(--warn)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
/* busca de alimentos */
.srch{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 14px;font:500 16px var(--font-b)}
.srch::placeholder{color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:14px;font-weight:600}
.flist{display:grid;max-height:46vh;overflow:auto}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 2px;width:100%}
.frow:first-child{border-top:0}
.frow b{font-weight:600}.frow span{font-size:13px;color:var(--ink-3);grid-column:1}.frow em{grid-row:1/3;grid-column:2;font-style:normal;color:var(--accent);font-weight:600}
.fsum{background:var(--surface-2);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.fsum b{font:700 22px/1.1 var(--font-d)}
.restin{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.restbar.pronto .restin{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.restbar.pronto .rest-prog{background:var(--good)}
.rring{width:46px;height:46px;flex:none;transform:rotate(-90deg)}
.rring .rt2{fill:none;stroke:var(--line);stroke-width:5}
.rring .rp2{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round}
.restbar.pronto .rring .rp2{stroke:var(--good)}
.bar.tb{height:6px;background:var(--surface-2)}
.bar.tb>i{background:var(--good);transition:width .5s cubic-bezier(.2,.8,.2,1)}
/* ===== movimento v2: toque, transições e brilho ===== */
:root{--eo:cubic-bezier(.2,.8,.2,1);--spr:cubic-bezier(.34,1.56,.64,1)}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:360px;background:radial-gradient(70% 100% at 50% 0,rgba(109,139,255,.14),transparent 72%);pointer-events:none;z-index:-1}
.card{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0) 120px),var(--surface);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.card.recado{background:var(--accent-soft)}
.btn.primary{background:linear-gradient(180deg,#86a0ff,#6680ff);box-shadow:0 8px 22px -10px rgba(109,139,255,.85),inset 0 1px 0 rgba(255,255,255,.25)}
/* toque: onda e afundar */
.btn,.opt,.chip,.exb,.food,.fch,.val,.done,.tab,.frow,.rbtn,.pk-steps button,.mini{position:relative;overflow:hidden}
.btn,.opt,.chip,.exb,.food,.fch,.done,.frow,.mini,.rbtn,.pk-steps button{transition:transform .14s var(--eo),background-color .25s,color .25s,border-color .25s,box-shadow .25s}
.fch:active,.food:active,.done:active,.mini:active,.frow:active,.rbtn:active,.pk-steps button:active{transform:scale(.95)}
.rip{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.22;transform:scale(0);animation:rip .6s var(--eo) forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}
/* folha que sobe */
.sheet{background:rgba(0,0,0,0);transition:background-color .3s ease}
.sheet.on{background:var(--scrim)}
.sheet-in{position:relative;transform:translateY(105%);transition:transform .42s cubic-bezier(.22,1,.36,1);will-change:transform;padding-top:30px}
.sheet.on .sheet-in{transform:none}
.sheet.drag .sheet-in{transition:none}
.grab{position:absolute;left:0;right:0;top:0;height:30px;display:grid;place-items:center;touch-action:none;cursor:grab}
.grab::before{content:"";width:42px;height:5px;border-radius:5px;background:var(--ink-3);opacity:.6}
.sheet-x{position:absolute;top:14px;right:max(14px,env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);font-size:24px;line-height:1;display:grid;place-items:center;z-index:2;padding:0}
.sheet-in>.grab+.sheet-x+*{padding-right:50px}
/* aviso com desfazer */
.toast{top:auto;bottom:calc(80px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-radius:14px;background:#e9eef6;color:#0a0e13;box-shadow:0 14px 34px -12px rgba(0,0,0,.75);transform:translate(-50%,24px) scale(.96);opacity:0;transition:transform .38s var(--spr),opacity .2s,bottom .3s var(--eo);overflow:hidden;max-width:min(528px,calc(100% - 32px))}
.toast.on{transform:translate(-50%,0) scale(1);opacity:1}
body.resting .toast{bottom:calc(156px + env(safe-area-inset-bottom,0px))}
.tmsg{flex:1;min-width:0}
.tbtn{border:0;background:#d6def0;color:#2c47d6;font:700 15px var(--font-b);padding:0 14px;min-height:40px;border-radius:10px;white-space:nowrap}
.tbar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:#6d8bff;transform-origin:left;animation:tbar linear forwards}
@keyframes tbar{to{transform:scaleX(0)}}
/* barra de descanso */
.restbar{transform:translateY(calc(100% + 90px));opacity:0;transition:transform .45s var(--spr),opacity .25s}
.restbar.on{transform:none;opacity:1}
.rring .rp2{transition:stroke-dashoffset .25s linear,stroke .3s}
.rest-prog{transition:width .25s linear}
.restin{box-shadow:0 16px 36px -14px rgba(0,0,0,.8)}
.restbar.pronto .restin{animation:glowG 1.3s ease-in-out infinite}
@keyframes glowG{0%,100%{box-shadow:0 0 0 0 rgba(51,214,159,0)}50%{box-shadow:0 0 0 6px rgba(51,214,159,.28)}}
#restTime{display:inline-block;transform-origin:left center;transition:color .3s}
.restbar.fim #restTime{color:var(--warn);animation:beat 1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}20%{transform:scale(1.14)}}
/* abas */
.tabs{background:rgba(14,19,26,.84);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5)}
.tabs-in{position:relative}
.tab-ind{position:absolute;top:0;bottom:0;left:0;width:calc((100% - 8px)/5);border-radius:12px;background:var(--accent-soft);box-shadow:inset 0 0 0 1px rgba(109,139,255,.35),0 0 18px -4px rgba(109,139,255,.55);transform:translateX(calc(var(--i,0)*(100% + 2px)));transition:transform .42s cubic-bezier(.3,1.25,.5,1);pointer-events:none}
.tab{z-index:1}
.tab[aria-current="page"]{background:transparent}
.tab[aria-current="page"] svg{animation:tabpop .45s var(--spr)}
@keyframes tabpop{0%{transform:scale(.7) translateY(3px)}100%{transform:none}}
/* troca de aba e de ficha */
.view.inR>*,.view.swapR>*:not(.fichas){animation:inR .34s var(--eo) both}
.view.inL>*,.view.swapL>*:not(.fichas){animation:inL .34s var(--eo) both}
.view.inR>*:nth-child(2),.view.inL>*:nth-child(2),.view.swapR>*:nth-child(2),.view.swapL>*:nth-child(2){animation-delay:.03s}
.view.inR>*:nth-child(3),.view.inL>*:nth-child(3),.view.swapR>*:nth-child(3),.view.swapL>*:nth-child(3){animation-delay:.06s}
.view.inR>*:nth-child(4),.view.inL>*:nth-child(4),.view.swapR>*:nth-child(4),.view.swapL>*:nth-child(4){animation-delay:.09s}
.view.inR>*:nth-child(n+5),.view.inL>*:nth-child(n+5),.view.swapR>*:nth-child(n+5),.view.swapL>*:nth-child(n+5){animation-delay:.12s}
@keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes pop2{0%{transform:scale(.6)}100%{transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes itemIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
/* treino: séries */
.kc{font-weight:700;color:var(--good)}
.bar.tb{height:8px}
.bar.tb>i{position:relative;overflow:hidden;background:linear-gradient(90deg,#1fb985,var(--good));box-shadow:0 0 12px rgba(51,214,159,.5);transition:width .6s var(--eo)}
.bar.tb>i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:translateX(-100%);animation:shim 2.4s ease-in-out infinite}
@keyframes shim{to{transform:translateX(100%)}}
.srow2{transition:background-color .3s}
.srow2.armed{background:rgba(51,214,159,.3)}
.srow2.feita.armed{background:rgba(255,93,108,.3)}
.sbg{transition:transform .2s var(--spr)}
.srow2.armed .sbg{transform:scale(1.08)}
.sfg{transition:transform .45s var(--spr),background-color .3s,box-shadow .3s}
.val{transition:color .3s,background-color .3s,border-color .3s,transform .14s var(--eo)}
.sn{transition:color .3s}
.srow2.next .sfg{box-shadow:inset 0 0 0 1.5px rgba(109,139,255,.6),0 0 16px -6px rgba(109,139,255,.7)}
.srow2.next .sn{color:var(--accent)}
.done svg path,.box svg path{stroke-dasharray:1;stroke-dashoffset:0}
.srow2.just .sfg::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,rgba(51,214,159,.5),rgba(51,214,159,.1) 70%,rgba(51,214,159,0));transform-origin:left;animation:sweep .75s var(--eo) forwards;pointer-events:none}
@keyframes sweep{0%{transform:scaleX(0);opacity:1}55%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
.srow2.just .done{animation:pop2 .5s var(--spr)}
.srow2.just .done svg path{animation:draw .38s .08s var(--eo) both}
.srow2.just .val{animation:valin .45s var(--eo)}
@keyframes valin{0%{transform:scale(1.1)}100%{transform:none}}
.srow2.just .prp{animation:pop2 .5s .2s var(--spr) both}
.srow2.undo .sfg{animation:shake .4s var(--eo)}
@keyframes shake{20%{transform:translateX(-7px)}50%{transform:translateX(5px)}80%{transform:translateX(-2px)}}
.card.ex{transition:border-color .4s,box-shadow .4s}
.card.ex.exdone{border-color:rgba(51,214,159,.45)}
.card.ex.justdone{animation:cardglow 1.2s var(--eo)}
@keyframes cardglow{0%{box-shadow:0 0 0 0 rgba(51,214,159,.6)}100%{box-shadow:0 0 0 16px rgba(51,214,159,0)}}
.okb{display:inline-flex;align-items:center;gap:5px;justify-self:start;font:700 12.5px/1 var(--font-d);letter-spacing:.08em;text-transform:uppercase;color:var(--good);background:var(--good-soft);padding:5px 9px;border-radius:999px;animation:pop2 .45s var(--spr) both}
.okb svg{width:13px;height:13px}
.btn.pronto{animation:pulseA 1.8s ease-in-out infinite}
@keyframes pulseA{0%,100%{box-shadow:0 8px 22px -10px rgba(109,139,255,.85),0 0 0 0 rgba(109,139,255,.55)}50%{box-shadow:0 8px 22px -10px rgba(109,139,255,.85),0 0 0 9px rgba(109,139,255,0)}}
.exinfo{animation:unfold .38s var(--eo) both;transform-origin:top}
.exinfo .link{justify-self:center}
@keyframes unfold{from{opacity:0;transform:translateY(-8px) scaleY(.96)}to{opacity:1;transform:none}}
.corpo .m.p,.corpo .m.s,.corpo .m.h1,.corpo .m.h2,.corpo .m.h3{animation:musc .8s var(--eo) both}
@keyframes musc{0%{fill:var(--mus-off)}}
.exinfo .corpo .m.p{animation:musc .8s var(--eo) both,mpulse 2.2s .8s ease-in-out infinite}
@keyframes mpulse{50%{opacity:.7}}
/* seletor */
.pk-read b{display:inline-block}
.pk-read b.up{animation:tUp .22s var(--eo)}
.pk-read b.dn{animation:tDn .22s var(--eo)}
@keyframes tUp{from{transform:translateY(16px);opacity:.3}to{transform:none;opacity:1}}
@keyframes tDn{from{transform:translateY(-16px);opacity:.3}to{transform:none;opacity:1}}
.rl-i{transition:color .15s,transform .2s var(--eo)}
.rl-mark{box-shadow:0 0 18px -3px rgba(109,139,255,.65)}
/* hoje */
.seg{transition:background-color .3s}
.seg.on{animation:segpop .45s var(--spr) both;box-shadow:0 0 10px -2px rgba(66,194,255,.55)}
@keyframes segpop{0%{transform:scaleY(.4);opacity:.4}100%{transform:none;opacity:1}}
.segc b{transition:width .5s var(--eo)}
.bar>i{transition:width .6s var(--eo)}
.numrow.ok .big{text-shadow:0 0 20px color-mix(in srgb,currentColor 55%,transparent)}
.rg{fill:none;opacity:0;transition:opacity .6s}
.rg.ok{opacity:.55}
.rg.hit{animation:hitg 1.5s var(--eo)}
@keyframes hitg{0%{opacity:0;stroke-width:11}30%{opacity:1;stroke-width:24}100%{opacity:.55;stroke-width:11}}
.rl.ok b{text-shadow:0 0 14px rgba(51,214,159,.55)}
.rl.hit{animation:pop2 .55s var(--spr)}
.item{animation:itemIn .35s var(--eo) both}
.box{transition:background-color .25s,border-color .25s}
.chk.on .box{animation:pop2 .4s var(--spr)}
.chk.on .box svg path{animation:draw .3s .06s var(--eo) both}
.opt,.food,.fch,.chip{transition:transform .14s var(--eo),background-color .25s,color .25s,border-color .25s}
.fly{position:fixed;z-index:65;pointer-events:none;font:700 21px/1 var(--font-d);letter-spacing:.02em;white-space:nowrap;transform:translate(-50%,-50%);animation:fly .95s var(--eo) forwards;text-shadow:0 2px 12px rgba(0,0,0,.7)}
@keyframes fly{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}20%{opacity:1;transform:translate(-50%,-90%) scale(1.12)}100%{opacity:0;transform:translate(-50%,-280%) scale(1)}}
/* progresso */
.sem-luz i{transition:background-color .3s,box-shadow .3s}
.sem-luz i.on{animation:lit .6s var(--eo) both}
.sem-luz i.y.on{animation-delay:.15s}.sem-luz i.g.on{animation-delay:.3s}
.sem-luz i.r.on{box-shadow:0 0 14px var(--bad)}.sem-luz i.y.on{box-shadow:0 0 14px var(--warn)}.sem-luz i.g.on{box-shadow:0 0 14px var(--good)}
@keyframes lit{0%{background:var(--surface-2);box-shadow:none}60%{filter:brightness(1.7)}}
.semr{animation:itemIn .4s var(--eo) both}
.semr:nth-child(2){animation-delay:.04s}.semr:nth-child(3){animation-delay:.08s}.semr:nth-child(4){animation-delay:.12s}.semr:nth-child(5){animation-delay:.16s}.semr:nth-child(6){animation-delay:.2s}.semr:nth-child(n+7){animation-delay:.24s}
.semr i.g{box-shadow:0 0 8px rgba(51,214,159,.6)}.semr i.y{box-shadow:0 0 8px rgba(255,194,74,.55)}.semr i.r{box-shadow:0 0 8px rgba(255,93,108,.6)}
.ch-line{stroke-dasharray:1;animation:draw 1.1s var(--eo) both}
.ch-area{animation:fadeA .8s .3s both}
@keyframes fadeA{from{opacity:0}}
.ch-dot{transform-box:fill-box;transform-origin:center;animation:pop2 .35s .7s var(--spr) both}
.cs.now{animation:nowp 2s ease-in-out infinite}
@keyframes nowp{50%{opacity:.55}}
/* esteira */
.run{transition:background-color .5s,color .5s}
.run.flash .run-speed{animation:pop2 .6s var(--spr)}
.run-prog i{transition:width .2s linear}
.exaviso{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.45}
.exaviso b{font-weight:700}
.howto{justify-self:start;margin-top:4px;background:none;border:0;padding:4px 0;color:var(--accent);font:600 14px var(--font-b);display:inline-flex;align-items:center;gap:6px}
.howto::before{content:"";width:0;height:0;border-left:8px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent}
.howto[aria-expanded="true"]::before{border-left:5px solid transparent;border-right:5px solid transparent;border-top:8px solid currentColor;border-bottom:0}
.demo{margin:0;display:grid;gap:6px}
.dm{position:relative;aspect-ratio:3/2;border-radius:12px;overflow:hidden;background:var(--surface-2)}
.dm img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.dm .d2{animation:dmx 2.6s ease-in-out infinite}
@keyframes dmx{0%,30%{opacity:0}45%,80%{opacity:1}95%,100%{opacity:0}}
.demo figcaption{font-size:12.5px;color:var(--ink-3)}
@media (max-width:360px){ .big{font-size:40px} .btn{font-size:14px;padding:8px} h1{font-size:30px} }
@media (prefers-reduced-motion:reduce){
  @keyframes inR{from{opacity:0}to{opacity:1}} @keyframes inL{from{opacity:0}to{opacity:1}} @keyframes rise{from{opacity:0}to{opacity:1}}
  @keyframes itemIn{from{opacity:0}to{opacity:1}} @keyframes fly{0%{opacity:0}25%{opacity:1}100%{opacity:0}} @keyframes shake{50%{opacity:.6}}
  @keyframes unfold{from{opacity:0}to{opacity:1}} @keyframes beat{50%{opacity:.7}}
  .bar.tb>i::after{animation:none} .sheet-in{transition-duration:.25s} .tab-ind,.restbar{transition-duration:.2s}
}

/* ---------- armazenamento fora do Claude ----------
   Mesmo formato da API do Claude usada pelo app: collection(nome).onSnapshot(fn) e doc('colecao/id').set(dados) / .delete().
   No modo normal grava no localStorage; no modo ?demo fica só na memória e recomeça a cada carregamento. */
function bancoLocal(){
  var KEY='diario:db',st={},subs=[];
  if(MODO.demo)st=dadosDemo();else{try{st=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){st={};}}
  function grava(){if(MODO.demo)return;try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){throw {code:'quota_exceeded'};}}
  function snap(col){var docs=Object.keys(st).filter(function(k){return k.split('/')[0]===col;}).sort().map(function(k){var v=st[k];return {id:k.slice(col.length+1),exists:true,data:function(){return clone(v);}};});return {docs:docs,size:docs.length,empty:!docs.length};}
  function avisa(col){subs.forEach(function(x){if(x.col===col)x.fn(snap(col));});}
  return {
    collection:function(col){return {onSnapshot:function(fn){var x={col:col,fn:fn};subs.push(x);setTimeout(function(){fn(snap(col));},0);return function(){subs.splice(subs.indexOf(x),1);};}};},
    doc:function(p){var col=p.split('/')[0];return {
      set:function(b){try{st[p]=clone(b);grava();}catch(e){return Promise.reject(e);}setTimeout(function(){avisa(col);},0);return Promise.resolve();},
      delete:function(){delete st[p];try{grava();}catch(e){}setTimeout(function(){avisa(col);},0);return Promise.resolve();}};}
  };
}

function somaS(s,f){return s.reduce(function(a,x){return a+(x[f]||0);},0);}
function compara(e){
  var ss=S.treinos.filter(function(t){return t.ex&&t.ex[e.id]&&t.ex[e.id].s&&t.ex[e.id].s.length;}).sort(byData);
  if(ss.length<2)return null;
  var a=ss[ss.length-2],b=ss[ss.length-1],sa=a.ex[e.id].s,sb=b.ex[e.id].s,st;
  if(e.tempo){var ta=somaS(sa,'seg'),tb=somaS(sb,'seg');st=tb>ta?'up':tb<ta?'down':'eq';}
  else if(e.semCarga){var ra=somaS(sa,'r'),rb=somaS(sb,'r');st=rb>ra?'up':rb<ra?'down':'eq';}
  else{
    var ka=cargaPrincipal(sa)||0,kb=cargaPrincipal(sb)||0;
    if(kb>ka)st='up';else if(kb<ka)st='aj';
    else{var na=sa.filter(function(x){return x.kg===ka;}).reduce(function(s,x){return s+x.r;},0),nb=sb.filter(function(x){return x.kg===kb;}).reduce(function(s,x){return s+x.r;},0);st=nb>na?'up':nb<na?'down':'eq';}
  }
  return {e:e,st:st,antes:formatSets(e,sa),agora:formatSets(e,sb)};
}
function resumoSemana(){
  var m=segunda(S.hoje),ks=[],k;for(k=m;k<=S.hoje;k=addDays(k,1))ks.push(k);
  var ds=ks.map(diaDe).filter(Boolean);
  function media(arr){return arr.length?arr.reduce(function(a,b){return a+b;},0)/arr.length:null;}
  return {ini:m,dias:ks.length,
    treinos:S.treinos.filter(function(t){return !t.importado&&t.data>=m&&t.data<=S.hoje;}).length,
    tiros:contaSemana('tiros'),leves:contaSemana('leve'),incl:contaSemana('inclinada'),
    prot:media(ds.map(protG).filter(function(g){return g>0;})),
    agua:media(ds.map(function(d){return d.agua||0;}).filter(function(a){return a>0;})),
    carbo:media(ds.filter(function(d){return d.carbo!=null;}).map(function(d){return d.carbo;})),
    extras:ds.reduce(function(a,d){return a+((d.extras||[]).length);},0),
    exKcal:ds.reduce(function(a,d){return a+extrasKcal(d);},0),
    sono:media(ds.filter(function(d){return d.sono;}).map(function(d){return d.sono;})),
    energia:media(ds.filter(function(d){return d.energia;}).map(function(d){return d.energia;}))};
}

function leituraCintura(c){

function fimSD(){if(!SD)return;var s=SD;SD=null;$('#sheet').classList.remove('drag');if(s.dy>110||(s.dy>40&&Date.now()-s.t0<260))closeSheet();else $('#sheetIn').style.transform='';}

function opt(f,v,t){return '<button class="opt" data-act="log-set" data-f="'+f+'" data-v="'+String(v)+'" aria-pressed="'+(S.log[f]===v)+'">'+t+'</button>';}
function openLog(pre){var f=cardioDe(S.hoje),ch=cardioHoje(),b=f?{tipo:f.tipo,curto:!!f.curto,completo:f.tipo==='inclinada'?null:!!f.completo,dor:!!f.dor}:{tipo:ch.tipo,curto:!!ch.curto,completo:null,dor:false};S.log=Object.assign(b,pre||{});paintLog();}
function paintLog(){var l=S.log;openSheet('<h2>Registrar cardio de hoje</h2>'+
  '<div class="fld"><span class="eyebrow">O que você fez</span><div class="seg3">'+opt('tipo','tiros','Tiros')+opt('tipo','leve','Corrida leve')+opt('tipo','inclinada','Caminhada inclinada')+'</div></div>'+
  (l.tipo==='tiros'&&diaDePerna()?'<div class="fld"><span class="eyebrow">Tamanho</span><div class="seg2">'+opt('curto',true,'Curtos (metade)')+opt('curto',false,'Completos')+'</div></div>':'')+
  (l.tipo==='tiros'?'<div class="fld"><span class="eyebrow">Completou todos os tiros sem segurar no apoio?</span><div class="seg2">'+opt('completo',true,'Sim')+opt('completo',false,'Não')+'</div></div>':'')+
  (l.tipo==='leve'?'<div class="fld"><span class="eyebrow">Completou o tempo no ritmo de conversa?</span><div class="seg2">'+opt('completo',true,'Sim')+opt('completo',false,'Não')+'</div></div>':'')+
  '<div class="fld"><span class="eyebrow">Sentiu dor na canela ou no joelho?</span><div class="seg2">'+opt('dor',false,'Não')+opt('dor',true,'Sim')+'</div></div>'+
  '<div class="btns2"><button class="btn ghost" data-act="sheet-close">Cancelar</button><button class="btn primary" data-act="salvar-cardio">Salvar</button></div>');}
function salvarCardio(){
  var l=S.log;if(l.tipo!=='inclinada'&&l.completo==null){toast(l.tipo==='tiros'?'Responda se completou os tiros.':'Responda se completou a corrida.');return;}
  var cfg=cardioCfg(),k=S.hoje;
  var body={data:k,tipo:l.tipo,dor:!!l.dor,salvoEm:new Date().toISOString()};
  if(l.tipo==='tiros'){body.linha=cfg.linha;body.completo=!!l.completo;if(l.curto)body.curto=true;}
  if(l.tipo==='leve'){body.min=leveMin(k).min;body.completo=!!l.completo;}
  if(l.inicio){body.inicio=l.inicio;body.duracaoMin=l.duracaoMin;}
  dbP.then(function(db){if(!db){toast('Sem conexão com o armazenamento: não salvou.');return;}
    return db.doc('cardio/'+k).set(body).then(function(){closeSheet();toast(l.dor?'Registrado. Com dor, faça só caminhada inclinada até passar.':'Cardio registrado.');});
  }).catch(handleErr);
}
function mudarLinha(d){var cfg=cardioCfg(),nl=Math.max(0,Math.min(CARDIO.length-1,cfg.linha+d));if(nl===cfg.linha)return;
  dbP.then(function(db){if(!db){toast('Sem conexão com o armazenamento: não salvou.');return;}
    return db.doc('config/cardio').set({linha:nl,desde:S.hoje}).then(function(){toast('Agora: linha das semanas '+CARDIO[nl].sem+'.');});
  }).catch(handleErr);}

/* ---------- salvar treino ---------- */
function salvarTreino(){
  S.hoje=keyOf(new Date());
  var fk=S.ficha,F=FICHAS[fk],ex={},dec=[];
  var drS=draftDe(fk),docId=S.hoje+'-'+fk,prev=S.treinos.filter(function(t){return t.id===docId;})[0];
  var baseC=prev&&prev.cargasAntes?prev.cargasAntes:null,antesC={};
  F.ex.forEach(function(e){antesC[e.id]=baseC&&Object.prototype.hasOwnProperty.call(baseC,e.id)?baseC[e.id]:((S.cargas&&S.cargas[e.id])||null);});
  var undo={id:docId,fk:fk,prev:prev?(function(){var c=clone(prev);delete c.id;return c;})():null,cargas:clone(S.cargas)||{},draft:clone(drS)};
  F.ex.forEach(function(e){
    var sets=[];
    for(var i=0;i<3;i++){
      var key=e.id+'-'+i,dn=!!drS.done[key],o=valSerie(e,drS,i);
      if(e.tempo){var sg=o.seg!=null?o.seg:(dn?o.segT:null);if(sg>0)sets.push({seg:Math.round(sg)});}
      else{var r=o.r!=null?o.r:(dn?o.rT:null);if(r>0){var kg=e.semCarga?null:(o.kg!=null?o.kg:(dn?o.kgT:null));sets.push({kg:kg>0?r1(kg):null,r:Math.round(r)});}}
    }
    if(sets.length){ex[e.id]={s:sets};var d=decide(e,sets,antesC[e.id]);if(d)dec.push({e:e,d:d});}
  });
  if(!Object.keys(ex).length){toast('Anote as repetições de pelo menos um exercício.');return;}
  var btn=$('#btnSalvar');if(btn){btn.disabled=true;btn.textContent='Salvando…';}
  var dr=S.drafts[fk]||{},agora=new Date().toISOString();
  var body={data:S.hoje,ficha:fk,ex:ex,salvoEm:agora,fim:agora,cargasAntes:antesC};
  if(dr.inicio&&minutosDesde(dr.inicio)<=240){body.inicio=dr.inicio;body.duracaoMin=minutosDesde(dr.inicio);}
  dbP.then(function(db){
    if(!db){toast('Sem conexão com o armazenamento: não salvou.');return;}
    return db.doc('treinos/'+S.hoje+'-'+fk).set(body).then(function(){
      var novas=clone(S.cargas)||{};
      dec.forEach(function(x){if(x.d.next&&(x.e.tempo||x.e.semCarga||x.d.next.kg!=null))novas[x.e.id]=x.d.next;});
      return db.doc('config/cargas').set(novas);
    }).then(function(){delete S.drafts[fk];saveDrafts();closeRest();S.undoTreino=undo;vib([15,30,15]);tone(660,0.12);tone(880,0.2,0.1);mostrarResultado(fk,dec);});
  }).catch(handleErr).then(function(){var b=$('#btnSalvar');if(b)b.disabled=false;render('treino');});
}
function mostrarResultado(fk,dec){
  var rot={sobe:'Sobe',mantem:'Mantém',baixa:'Baixa'};
  openSheet('<div><span class="kicker">Treino salvo</span><h2>Ficha '+fk+' na próxima vez</h2></div><div class="res">'+dec.map(function(x){
    return '<div class="resrow"><div class="rh"><h3>'+x.e.n+'</h3><span class="pill '+x.d.tipo+'">'+rot[x.d.tipo]+'</span></div><p>'+x.d.txt+'</p>'+x.d.notas.map(function(n){return '<p class="n">'+n+'</p>';}).join('')+'</div>';
  }).join('')+'</div><button class="btn primary wide" data-act="sheet-close">Fechar</button>'+(S.undoTreino?'<button class="btn ghost" data-act="treino-desfazer">Salvei sem querer: desfazer</button>':''));
}
function desfazerTreino(){var u=S.undoTreino;if(!u)return;S.undoTreino=null;var b=$('[data-act="treino-desfazer"]');if(b){b.disabled=true;b.textContent='Desfazendo…';}
  dbP.then(function(db){if(!db){toast('Sem conexão com o armazenamento.');return;}var ref=db.doc('treinos/'+u.id);
    return (u.prev?ref.set(u.prev):ref.delete()).then(function(){return db.doc('config/cargas').set(u.cargas);}).then(function(){
      S.drafts[u.fk]=u.draft;saveDrafts();S.ficha=u.fk;S.fichaManual=true;closeSheet();render('treino');toast('Salvamento desfeito. As séries voltaram para a ficha.');});
  }).catch(handleErr);}

/* ---------- eventos ---------- */
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');
  if(!b){if(ev.target===$('#sheet'))closeSheet();return;}
  ensureAudio();
  var a=b.dataset.act;
  if(S.swiped&&Date.now()-S.swiped<400&&b.closest('.sfg'))return;
  if(a==='toast-act'){var tf=S.toastFn;escondeToast();if(tf)tf();return;}
  if(a==='tab')setTab(b.dataset.t);
  else if(a==='pick')abrirPicker(b.dataset.ex,parseInt(b.dataset.i,10));
  else if(a==='pk-step')passoPicker(b.dataset.f,parseFloat(b.dataset.d));
  else if(a==='rl-tap'){if(S.pick){var fz=b.dataset.f,vz=parseFloat(b.dataset.v);var scz=document.getElementById('rl-'+fz);if(scz)posRegua(scz,vz,true);}}
  else if(a==='pk-ok')salvarPicker(false);
  else if(a==='pk-done')salvarPicker(true);
  else if(a==='ex-info'){S.exOpen[b.dataset.ex]=!S.exOpen[b.dataset.ex];render('treino');}
  else if(a==='exfoto')exFotoEscolher(b.dataset.ex);
  else if(a==='food-abrir'){S.food={q:'',id:null,n:1};paintFood();}
  else if(a==='food-sel'){var fs=FOODMAP[b.dataset.id];if(fs){S.food=Object.assign(S.food||{q:''},{id:fs.id,n:(fs.qs||[1])[0]});paintFood();}}
  else if(a==='food-n'){S.food.n=parseFloat(b.dataset.n);paintFood();}
  else if(a==='food-voltar'){S.food.id=null;paintFood();var fq=document.getElementById('foodQ');if(fq)fq.focus();}
  else if(a==='food-ok'){addFood(S.food.id,S.food.n);closeSheet();}
  else if(a==='outro-del')tiraOutro(parseInt(b.dataset.i,10));
  else if(a==='agua'){var v=parseInt(b.dataset.v,10),tx=(v>0?'+':'−')+Math.abs(v)+' ml';var ra=editDia(function(d){d.agua=Math.max(0,(d.agua||0)+v);});fly(b,tx,'water');vib(8);desfazDia(ra,'Água: '+tx+'.');}
  else if(a==='add-abrir'){S.add={id:null,q:1};paintAdd();}
  else if(a==='add-food'){var af=ALIMAP[b.dataset.id];S.add={id:af.id,q:af.ideal};paintAdd(true);}
  else if(a==='add-q'){S.add.q=parseFloat(b.dataset.q);paintAdd(true);}
  else if(a==='add-ok'){var it=S.add.id+':'+S.add.q,nm=itemNome(it),gg=itemG(it);var rk=editDia(function(d){d.prot=(d.prot||[]).concat([it]);});closeSheet();desfazDia(rk,'Adicionado: '+nm+' (~'+gg+' g).');}
  else if(a==='add-whey'){var rw=editDia(function(d){d.prot=(d.prot||[]).concat(['whey:1']);});fly(b,'+'+wheyG()+' g','prot');vib(8);desfazDia(rw,'Whey: +'+wheyG()+' g.');}
  else if(a==='prot-del'){var di=parseInt(b.dataset.i,10),dd0=diaHoje(),itx=(dd0.prot||[])[di],oi=-1;(dd0.outros||[]).forEach(function(o,j){if(oi<0&&o.id+':'+o.q===itx)oi=j;});if(oi>=0)tiraOutro(oi);else{var rp=editDia(function(d){d.prot=(d.prot||[]).filter(function(_,j){return j!==di;});});desfazDia(rp,'Removido: '+(itx?itemNome(itx):'item')+'.');}}
  else if(a==='whey-cfg')paintWhey();
  else if(a==='whey-salvar')salvarWhey();
  else if(a==='emb'){var ev=b.dataset.v,ei=EMBMAP[ev];var re=editDia(function(d){d.emb=(d.emb||[]).concat([ev]);d.carbo=Math.round(((d.carbo||0)+ei.carbo)*2)/2;});fly(b,'+½ porção','carb');vib(8);desfazDia(re,'Barra '+ei.n+': +½ porção.');}
  else if(a==='emb-undo'){var reu=editDia(function(d){var l=(d.emb||[]).slice();var ev=l.pop();d.emb=l;if(ev&&EMBMAP[ev])d.carbo=Math.max(0,Math.round(((d.carbo||0)-EMBMAP[ev].carbo)*2)/2);});desfazDia(reu,'Barra tirada.');}
  else if(a==='carbo'){var cv2=parseFloat(b.dataset.v),tc=(cv2>0?'+':'−')+(Math.abs(cv2)===0.5?'½':num(Math.abs(cv2)))+(Math.abs(cv2)>1?' porções':' porção');var rc=editDia(function(d){d.carbo=Math.max(0,Math.round(((d.carbo||0)+cv2)*2)/2);});fly(b,tc,'carb');vib(8);desfazDia(rc,'Carboidrato: '+tc+'.');}
  else if(a==='extra'){var xv=b.dataset.v,xo=EXMAP[xv];var rx=editDia(function(d){d.extras=(d.extras||[]).concat([xv]);});fly(b,'+~'+(xo?xo.kcal:'')+' kcal','warn');vib(8);desfazDia(rx,'Extra: '+(xo?xo.n:'anotado')+'.');}
  else if(a==='extra-undo'){var rxu=editDia(function(d){d.extras=(d.extras||[]).slice(0,-1);});desfazDia(rxu,'Último extra tirado.');}
  else if(a==='sono'||a==='energia'){var sv=parseInt(b.dataset.v,10);editDia(function(d){if(d[a]===sv)delete d[a];else d[a]=sv;});}
  else if(a==='pose'){S.pose=b.dataset.p;render('prog');}
  else if(a==='foto-abrir')paintFotos();
  else if(a==='foto-pose')abrirArquivo(b.dataset.p);
  else if(a==='crop-voltar'){if(S.crop){URL.revokeObjectURL(S.crop.url);S.crop=null;}paintFotos();}
  else if(a==='crop-ok')salvarCrop();
  else if(a==='ref'){var id=b.dataset.v;editDia(function(d){d.ref=d.ref||{};d.ref[id]=!d.ref[id];});}
  else if(a==='abrir-ficha'){S.ficha=b.dataset.f;S.fichaManual=true;render('treino');setTab('treino');}
  else if(a==='ficha'){var f0=S.ficha,f1=b.dataset.f;if(f0===f1)return;S.ficha=f1;S.fichaManual=true;render('treino');animView($('#v-treino'),ORDEM.indexOf(f1)>ORDEM.indexOf(f0)?'swapR':'swapL');vib(6);}
  else if(a==='serie')concluirSerie(b.dataset.ex,parseInt(b.dataset.i,10));
  else if(a==='treino-iniciar'){var fki=S.ficha;iniciarSessao();render('treino');toast('Treino começou às '+hora(new Date().toISOString())+'.',{label:'Desfazer',fn:function(){var di2=S.drafts[fki];if(di2){delete di2.inicio;saveDrafts();render('treino');}}});}
  else if(a==='treino-zerar'){var fkz=S.ficha,dz=S.drafts[fkz];if(dz){var ini0=dz.inicio;dz.inicio=new Date().toISOString();saveDrafts();render('treino');toast('Contagem recomeçada.',{label:'Desfazer',fn:function(){var d3=S.drafts[fkz];if(d3){if(ini0)d3.inicio=ini0;else delete d3.inicio;saveDrafts();render('treino');}}});}}
  else if(a==='treino-desfazer')desfazerTreino();
  else if(a==='salvar-treino')salvarTreino();
  else if(a==='rest-plus'){Rest.end+=30000;Rest.total+=30;Rest.beeped=false;$('#restbar').classList.remove('pronto');if(!Rest.iv){Rest.iv=setInterval(tickRest,250);}tickRest();}
  else if(a==='rest-close')closeRest();
  else if(a==='cardio-start')iniciarCardio(b.dataset.t,b.dataset.curto==='1');
  else if(a==='cardio-log')openLog();
  else if(a==='linha')mudarLinha(parseInt(b.dataset.d,10));
  else if(a==='log-set'){var f=b.dataset.f,raw=b.dataset.v;S.log[f]=raw==='true'?true:raw==='false'?false:raw;paintLog();}
  else if(a==='salvar-cardio')salvarCardio();
  else if(a==='sheet-close')closeSheet();
  else if(a==='run-pause'){
    if(R.paused){R.paused=false;R.end=Date.now()+R.left;b.textContent='Pausar';tickRun();}
    else{R.paused=true;R.left=R.end-Date.now();b.textContent='Continuar';}
  }
  else if(a==='run-stop')fimCardio(false);
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='foodQ'){if(S.food)S.food.q=t.value;var flx=document.getElementById('flist');if(flx)flx.innerHTML=listaFood(t.value);return;}
  if(t.id==='corte'&&S.crop){S.crop.pct=parseInt(t.value,10);drawCrop();return;}if(!t.id||!$('#v-treino').contains(t))return;
  var fk=S.ficha,dr=S.drafts[fk]=S.drafts[fk]||{v:{},done:{}};dr.v=dr.v||{};dr.v[t.id]=t.value;saveDrafts();
  if(/-(r|seg)$/.test(t.id)&&t.value.trim()!=='')iniciarSessao();

document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='fotoIn'){carregarFoto(t.files&&t.files[0]);return;}
  if(t.id==='exFotoIn'){exFotoCarregar(t.files&&t.files[0]);return;}
  if(t.id==='exSel'){S.exSel=t.value;try{localStorage.setItem(LSP+'exSel',t.value);}catch(e){}t.blur();render('reg');return;}
  if(t.id==='peso'||t.id==='cintura'){
    var v=parseNum(t.value),f=t.id,lim=f==='peso'?[30,250]:[40,200];
    if(t.value.trim()===''){editDia(function(d){delete d[f];});return;}
    if(!(v>=lim[0]&&v<=lim[1])){toast(f==='peso'?'Digite o peso em kg, por exemplo 75,8.':'Digite a cintura em cm, por exemplo 88.');return;}
    editDia(function(d){d[f]=r1(v);});toast(f==='peso'?'Peso salvo.':'Cintura salva.');
  }
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&!$('#sheet').hidden)closeSheet();});

/* ---------- dados ---------- */
setTab(S.tab,true);renderAll();
if(MODO.demo){var bnD=$('#banner');bnD.innerHTML='Modo demonstração: dados de exemplo. O que você mudar some ao recarregar a página. <a href="./" style="color:inherit;font-weight:700">Usar com os meus dados</a>';bnD.hidden=false;}
dbP.then(function(db){
  if(!db){S.dbState='off';var bn=$('#banner');bn.textContent='Não consegui abrir seus registros agora. Os cronômetros funcionam, mas nada fica salvo. Abra pelo app do Claude, conectado à sua conta.';bn.hidden=false;renderAll();return;}
  S.db=db;
  var got={dias:0,treinos:0,cardio:0,config:0};
  function ready(n){got[n]=1;if(got.dias&&got.treinos&&got.cardio&&got.config)S.dbState='ok';}
  function onErr(e){if(e&&e.code==='revoked'){S.dbState='off';}try{console.warn(e);}catch(x){}}
  db.collection('dias').onSnapshot(function(sn){var o={};sn.docs.forEach(function(d){o[d.id]=d.data();});S.dias=o;ready('dias');render('hoje');render('prog');},onErr);
  db.collection('treinos').onSnapshot(function(sn){S.treinos=sn.docs.map(function(d){return Object.assign({id:d.id},d.data());});ready('treinos');renderAll();},onErr);
  db.collection('cardio').onSnapshot(function(sn){S.cardio=sn.docs.map(function(d){return Object.assign({id:d.id},d.data());});ready('cardio');render('hoje');render('cardio');render('reg');render('prog');},onErr);
  db.collection('config').onSnapshot(function(sn){sn.docs.forEach(function(d){if(d.id==='cargas')S.cargas=d.data();if(d.id==='cardio')S.cardioCfg=d.data();if(d.id==='perfil')S.perfil=d.data();if(d.id==='metas')S.metas=d.data();if(d.id==='revisao')S.revisao=d.data();});ready('config');render('treino');render('cardio');render('reg');render('hoje');render('prog');},onErr);
  db.collection('exfotos').onSnapshot(function(sn){var o={};sn.docs.forEach(function(d){var x=d.data();if(x&&x.id)o[d.id]=x.id;});S.exfotos=o;render('treino');},onErr);
  db.collection('fotos').onSnapshot(function(sn){S.fotos=sn.docs.map(function(d){return d.data();});render('prog');},onErr);
});

asP.then(function(a){S.assets=a||null;render('prog');});
